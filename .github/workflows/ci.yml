name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run score

  # Re-runs every published study on the pinned τ-bench / τ²-bench data and fails if a committed
  # result file changes or one of the five hand-confirmed real catches stops being flagged.
  studies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.study.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tool-truth-tau
            ~/.cache/tool-truth-tau2
          key: tau-data-${{ hashFiles('study/fetch-cached.ts') }}
      - run: sh study/run-all.sh
      - name: Fail if a published result changed
        run: |
          git status --porcelain study
          test -z "$(git status --porcelain study)"
